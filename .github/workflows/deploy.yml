name: Deploy THISHI to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check
        run: pnpm check
      - name: Build
        run: pnpm build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Confirm Actions publishing source
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            let site = await github.rest.repos.getPages(repo);
            if (site.data.build_type !== 'workflow') {
              await github.rest.repos.updateInformationAboutPagesSite({...repo, build_type: 'workflow'});
              site = await github.rest.repos.getPages(repo);
            }
            if (site.data.build_type !== 'workflow') throw new Error('Pages Source must be GitHub Actions');
            core.info('Confirmed Pages Source: GitHub Actions (workflow)');
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
